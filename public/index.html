<!DOCTYPE html>
<html lang="en">
<head>
  <title>LUCID AI</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="auth-screen" class="auth-container">
    <button class="auth-theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
    </button>
    

    <h2 id="authTitle">Welcome to Lucid AI<span style="color: var(--brand-color);">.</span></h2>
    
    <div>
        <input type="email" id="emailInput" placeholder="Enter your email" required>
        <input type="password" id="passwordInput" placeholder="Enter your password" required>
        <button id="primaryAuthBtn" class="btn-primary" onclick="handleLogin(event)">Log In</button>
    </div>
    
    <div class="auth-toggle">
        <p id="toggleText">First time here? <span onclick="document.getElementById('authTitle').innerHTML='Create an Account<span style=\'color: var(--brand-color);\'>.</span>'; document.getElementById('primaryAuthBtn').innerText='Sign Up'; document.getElementById('primaryAuthBtn').onclick=handleRegister; this.parentElement.innerHTML='Already have an account? <span onclick=\'window.location.reload()\'>Log In</span>';">Create your account</span></p>
    </div>
</div>


  <div id="app-content" style="display: none; width: 100%;">
    <aside class="sidebar">
      <h1>LUCID AI<span style="color: var(--brand-color);">.</span></h1>
      <nav class="nav-menu">
        <a onclick="showTopics()" class="nav-item" id="navTopics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Topics
        </a>
        <a onclick="showFeed()" class="nav-item active" id="navFeed">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
          Feed
        </a>
        <a onclick="showTimeline()" class="nav-item" id="navTimeline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          Timeline
        </a>
        <a onclick="showBookmarks()" class="nav-item" id="navBookmarks">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
          Bookmarks
        </a>
        <a onclick="handleLogout()" class="nav-item settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Log Out
        </a>
      </nav>
    </aside>

    <main class="main-content" id="mainScroll">
      <div class="content-wrapper">
        
        <div class="header-glass" id="glassHeader">
          <h2 class="section-title" id="pageTitle">Your Feed</h2>
          <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle Dark Mode">
            <svg id="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            <svg id="sun-icon" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          </button>
        </div>

        <div id="bookmarks" style="display: none;">
          <div id="bookmarksList"></div>
        </div>

        <div id="timelinePanel">
          <div id="timelineList" style="color: var(--text-light);">Loading timeline...</div>
        </div>

        <div class="topics-panel" id="topicsPanel">
          <div class="topic-search-container">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="topicSearchInput" placeholder="Search headings...">
          </div>

          <div class="topic-group">
            <div class="topic-label">AI Trends & Models</div>
            <div class="tags-container">
              <button class="tag-pill active" onclick="filterFeed(this, 'ALL')">All News</button>
              <button class="tag-pill" onclick="filterFeed(this, '#AgenticAI')">#AgenticAI</button>
              <button class="tag-pill" onclick="filterFeed(this, '#NextGenModels')">#NextGenModels</button>
              <button class="tag-pill" onclick="filterFeed(this, '#GenAI')">#GenAI</button>
            </div>
          </div>
          
          <div class="topic-group">
            <div class="topic-label">Research & Publications</div>
            <div class="tags-container">
              <button class="tag-pill" onclick="filterFeed(this, '#PapersAndResearch')">#Papers & Research</button>
              <button class="tag-pill" onclick="filterFeed(this, '#MLResearch')">#MLResearch</button>
            </div>
          </div>

          <div class="topic-group">
            <div class="topic-label">Industry & Workforce</div>
            <div class="tags-container">
              <button class="tag-pill" onclick="filterFeed(this, '#FutureOfWork')">#FutureOfWork</button>
              <button class="tag-pill" onclick="filterFeed(this, '#OrgChanges')">#OrgChanges</button>
              <button class="tag-pill" onclick="filterFeed(this, '#AIEthics')">#AIEthics</button>
            </div>
          </div>
        </div>
        
        <div class="control-panel" id="controlPanel">
          <p><strong id="queueCount">0</strong> articles waiting in the queue.</p>
          <button class="btn" id="scrapeBtn" onclick="runScraper()">Fetch Intelligence</button>
          <button class="btn" id="processBtn" onclick="runProcessor()">Process Summaries</button>
          <div class="status" id="statusMsg"></div>
        </div>

        <div id="feed"></div>

      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
